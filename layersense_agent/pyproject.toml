[project]
name = "layersense_agent"
version = "0.1.0"
description = "LayerSense Agent - An Agent-powered backend for AI-assisted animations using Manim and Excalidraw."
authors = [{ name = "Mathew S Roewe", email = "42layerwise@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["python", "openai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

# Core runtime dependencies
dependencies = [
    "fastapi[standard]==0.136.1",
    "openai-agents==0.10.5",
    "pydantic==2.12.5",
    "uvicorn==0.35.0",
]

[build-system]
# ---- Build System ----
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layersense_agent"]

# ---- Tooling Configurations ----

# potentially useful
# [tool.pytest.ini_options]
