services:
  frontend:
    container_name: layersense_frontend
    build:
      context: ./layersense_frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./layersense_frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - agent
      - controller

  redis:
    container_name: layersense_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"

  agent:
    container_name: layersense_agent
    build:
      context: .
      dockerfile: layersense_agent/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  controller:
    container_name: layersense_controller
    build:
      context: .
      dockerfile: layersense_controller/Dockerfile
    ports:
      - "8001:8001"
    environment:
      LAYERSENSE_STORAGE_ROOT: /layersense_artifacts/storage
      LAYERSENSE_RENDER_WORKDIR: /tmp/layersense-renders
      LAYERSENSE_DB_PATH: /layersense_artifacts/db/layersense.sqlite
      LAYERSENSE_REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./layersense_artifacts:/layersense_artifacts

  controller-worker:
    container_name: layersense_controller_worker
    build:
      context: .
      dockerfile: layersense_controller/Dockerfile
    command: ["taskiq", "worker", "layersense_controller.worker:broker"]
    environment:
      LAYERSENSE_STORAGE_ROOT: /layersense_artifacts/storage
      LAYERSENSE_RENDER_WORKDIR: /tmp/layersense-renders
      LAYERSENSE_DB_PATH: /layersense_artifacts/db/layersense.sqlite
      LAYERSENSE_REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./layersense_artifacts:/layersense_artifacts

volumes:
  frontend_node_modules:
