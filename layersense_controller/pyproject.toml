[project]
name = "layersense_controller"
version = "0.1.0"
description = "LayerSense Controller auxiliary service."
authors = [{ name = "Mathew S Roewe", email = "42layerwise@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

# Core runtime dependencies
dependencies = [
    "fastapi[standard]==0.116.1",
    "watchdog==6.0.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.10.1",
    "manim==0.20.1",
]

[build-system]
# ---- Build System ----
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layersense_controller"]

[tool.hatch.build.targets.wheel.force-include]
"src/layersense_controller/resources/manim-preview.cfg" = "layersense_controller/resources/manim-preview.cfg"
"src/layersense_controller/resources/manim-final.cfg" = "layersense_controller/resources/manim-final.cfg"

# ---- Tooling Configurations ----

# potentially useful
# [tool.pytest.ini_options]
