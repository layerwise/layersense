services:
  e2e-runner:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    working_dir: /workspace
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CODESTRAL_API_KEY: ${CODESTRAL_API_KEY}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
