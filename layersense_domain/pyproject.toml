[project]
name = "layersense_domain"
version = "0.1.0"
description = "LayerSense Domain shared models and services."
authors = [{ name = "Mathew S Roewe", email = "42layerwise@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = ["pydantic==2.12.5"] # Core runtime dependencies

[build-system]
# ---- Build System ----
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layersense_domain"]

# ---- Tooling Configurations ----

# potentially useful
# [tool.pytest.ini_options]
