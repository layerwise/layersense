[project]
name = "layersense_persistence"
version = "0.1.0"
description = "LayerSense durable persistence models and repositories."
authors = [{ name = "Mathew S Roewe", email = "42layerwise@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["python", "sqlite", "sqlalchemy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "alembic==1.17.2",
    "pydantic==2.12.5",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layersense_persistence"]
