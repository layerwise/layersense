[project]
name = "layersense_storage"
version = "0.1.0"
description = "LayerSense object storage abstraction."
authors = [{ name = "Mathew S Roewe", email = "42layerwise@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = ["pydantic-settings==2.10.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layersense_storage"]
