[project]
name = "LayerSense"
version = "0.1.0"
description = "LayerSense - An Agent-powered backend for AI-assisted animations using Manim and Excalidraw."
authors = [{ name = "Mathew S Roewe", email = "*********@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["python", "openai-agents", "manim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]

# Core runtime dependencies
dependencies = [
    "layersense_agent",
    "layersense_controller",
    "dotenv==0.9.9",
    "fastapi[standard]==0.136.1",
    "langchain==1.2.10",
    "langchain-openai==1.1.10",
    "langgraph==1.0.10",
    "langsmith==0.7.14",
    "openai==2.26.0",
    "openai-agents==0.10.5",
    "pydantic==2.12.5",
    "uvicorn==0.35.0",
    "requests==2.32.5",
]

[project.optional-dependencies]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.6.19"]

[dependency-groups]
dev = [
    "pdbpp==0.12.1",
    "rich==14.1.0",
    "ruff==0.13.0",
    "black==25.1.0",
    "isort==8.0.1",
    "mypy==1.18.1",
    "pre-commit==4.5.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "pytest-recording==0.13.4",
]

[project.urls]
# homepage = "https://github.com/yourname/my_project"
# repository = "https://github.com/yourname/my_project"
# issues = "https://github.com/yourname/my_project/issues"


[tool.uv.sources]
layersense_agent = { workspace = true }
layersense_controller = { workspace = true }

[tool.uv.workspace]
members = ["layersense_agent", "layersense_controller"]

# ---- Tooling Configurations ----

[tool.ruff]
line-length = 99
target-version = "py314"
extend-exclude = ["layersense_scenes"]
# lint.extend-select = ["B", "C4", "I", "UP", "W"]

lint.select = [
    "E",  # pycodestyle error
    "W",  # pycodestyle warning
    "F",  # pyflakes
    "UP", # pyupgrade
    "D",  # pydocstyle
    "I",  # isort
]
lint.ignore = [
    "E501", # ignore long-line warnings (handled by Black)
    "F401", # ignore unused imports (handled only during pre-commit)
    "D100", # missing docstring in pubuc module
    "D101", # missing docstring in publuc class
    "D102", # missing docstring in publuc method
    "D103", # missing docstring in publuc function
    "D104", # missing docstring in publuc package
    "D105", # missing docstring in magic method
    "D107", # missing docstring in `__ini__`

]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 99
target-version = ["py312"]
extend-exclude = "^/layersense_scenes/"

[tool.mypy]
python_version = "3.14"
strict = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["layersense_agent/tests", "layersense_controller/tests", "tests"]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto --strict-markers"
markers = [
    "unit: fast isolated tests",
    "integration: cassette-backed boundary tests",
    "e2e: live-stack end-to-end tests",
    "ai: assistant-authored tests",
]
